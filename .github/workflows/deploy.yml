name: Deploy to Server

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies & Build
        run: |
          npm ci
          npm run build

          if [ -d "dist" ]; then
            tar -czf deploy.tar.gz dist
          elif [ -d "build" ]; then
            tar -czf deploy.tar.gz build
          else
            echo "Build folder tidak ditemukan"
            exit 1
          fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Upload ke Server
        run: |
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR deploy.tar.gz "$SSH_USER@$SSH_HOST":/var/www/myhermes-fe/

      - name: Extract di Server
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR "$SSH_USER@$SSH_HOST" "
          cd /var/www/myhermes-fe &&
          rm -rf assets images index.html dist build favicon.png &&
          tar -xzf deploy.tar.gz &&
          if [ -d dist ]; then
            mv dist/* . && rm -rf dist
          elif [ -d build ]; then
            mv build/* . && rm -rf build
          fi
          rm deploy.tar.gz
          "
